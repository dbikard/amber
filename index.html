<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d0b18">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Amber — The Succession</title>
<script>window.GAME_VERSION = '0.9.9';</script>
<link rel="manifest" href="manifest.json?v=0.9.9">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png?v=0.9.9">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=0.9.9">
<link rel="stylesheet" href="styles.css?v=0.9.9">
</head>
<body>
<canvas id="game"></canvas>
<canvas id="overlay"></canvas>

<div id="banner-wrap"></div>
<!-- THE KNELL: a rival's walk, thrown across the middle of the board and fading. It is the
     one thing that wins without touching you, so it does not share a corner with rift
     warnings. -->
<div id="knell" class="hidden"></div>

<div id="hud" class="hidden">
  <div id="hud-top">
    <span id="rival-name"></span>
    <span id="timer"></span>
    <button id="btn-pause" title="Call a halt">⏸</button>
  </div>
  <!-- THE YARD. What is rationed in this game is the masons, not the works, and until now
       the only way to learn you had none free was to be refused. Top-left, opposite the
       walkers, because it is a standing fact rather than an event. -->
  <div id="masons" title="mason crews — idle of total"><span class="m-ico">🔨</span><b id="m-free">1</b><span id="m-of">/1</span></div>
  <!-- every heir currently on the Pattern, and how far along: a race everyone can see -->
  <div id="walkers"></div>
  <div id="hud-bottom">
    <div id="hud-left">
      <div id="flag-tray"></div>
      <div id="essence"><span class="ess-ico">◆</span> <b id="ess-n">0</b> <span id="ess-rate"></span></div>
    </div>
    <span id="my-pattern" class="hidden"></span>
    <button id="btn-build" title="Raise a work">🔨<span id="build-lbl">BUILD</span></button>
    <div id="powers">
      <button id="pw-storm" class="pw" title="Jewel of Judgment"><span class="pw-ico">⛈</span><span class="pw-cd"></span></button>
      <button id="pw-trump" class="pw" title="Trump of Benedict"><span class="pw-ico">🃏</span><span class="pw-cd"></span></button>
    </div>
  </div>
</div>

<!-- the halt. Anyone at the table may call one and anyone may lift it, so the whole panel
     is the button: on a phone the thing you want is the biggest target on the screen. -->
<button id="halt" class="hidden">
  <span class="halt-ico">⏸</span>
  <span class="halt-title">HALTED</span>
  <span class="halt-who"></span>
  <span class="halt-hint">tap anywhere to go on</span>
</button>

<div id="sheet" class="hidden"></div>

<div id="menu">
  <h1>AMBER</h1>
  <div class="sub">— The Succession —</div>
  <p class="lore">Oberon is gone. The black road reaches for the one true city.<br>
     Raise your works, walk in Shadow, and take the throne — by siege, or by the Pattern.</p>
  <!-- the footing is a preference, not a per-mode question: it governs the campaign and a
       skirmish alike, so it sits above both rather than inside one fold-out -->
  <div id="footing-row"></div>
  <button id="btn-campaign" class="mbtn"></button>
  <div id="campaign-note" class="diff-note"></div>
  <button id="btn-skirmish" class="mbtn">SKIRMISH — CHOOSE YOUR RIVAL</button>
  <div id="skirmish-row" class="hidden"></div>
  <button id="btn-lan" class="mbtn">LAN — UP TO FOUR HEIRS</button>
  <div id="lan-panel" class="hidden">
    <div id="lan-net" class="hidden"></div>
    <div id="lan-status">same Wi-Fi · no server · pair by QR · two to four heirs</div>
    <canvas id="qr-display" class="hidden"></canvas>
    <div class="lan-row">
      <button id="qr-host" class="mbtn small">HOST THE TABLE</button>
      <button id="qr-join" class="mbtn small">JOIN A TABLE</button>
      <button id="qr-scan-reply" class="mbtn small hidden">SCAN REPLY</button>
    </div>
    <button id="lan-start" class="mbtn hidden">BEGIN</button>
    <!-- WHAT TO DO WHEN THE WI-FI REFUSES. Shown only when a pairing has actually failed:
         advice nobody needs is advice nobody reads. -->
    <div id="lan-help" class="hidden">
      <div class="help-title" id="lan-help-title"></div>
      <div class="help-body" id="lan-help-why"></div>
      <button id="lan-hotspot" class="mbtn small hidden">OPEN HOTSPOT SETTINGS</button>
      <div class="help-body" id="lan-help-os"></div>
    </div>
    <pre id="lan-diag" class="hidden"></pre>
  </div>
  <button id="btn-roll" class="mbtn">⚔ THE MUSTER ROLL</button>
  <button id="menu-record" class="mbtn small hidden">📜 CHRONICLE OF THE LAST MATCH</button>
  <div id="version"></div>
</div>

<!-- THE MUSTER ROLL: every hall that forks, every branch it may take, and every man in Amber
     with his numbers. Built from CONST at open time, so it cannot drift from the game. -->
<div id="roll" class="hidden">
  <h2>THE MUSTER ROLL</h2>
  <div id="roll-body"></div>
  <button id="roll-close" class="mbtn">CLOSE</button>
</div>

<div id="end" class="hidden">
  <h2 id="end-title"></h2>
  <p id="end-sub"></p>
  <button id="end-next" class="mbtn"></button>
  <button id="end-menu" class="mbtn">MENU</button>
  <div class="lan-row">
    <button id="end-copy" class="mbtn small">📜 COPY THE CHRONICLE</button>
    <button id="end-save" class="mbtn small">SAVE</button>
  </div>
  <!-- the match as curves. Below the buttons on purpose: NEXT and MENU must stay at thumb's
       reach on a phone, and the reading of the match is what you scroll to. -->
  <div id="end-stats" class="hidden"></div>
</div>

<!-- last resort when the browser will not reach the clipboard: somewhere to select it by hand -->
<div id="record-box" class="hidden">
  <textarea id="record-text" readonly></textarea>
  <button id="record-close" class="mbtn small">CLOSE</button>
</div>

<div id="scanner" class="hidden">
  <video id="scan-video" playsinline muted></video>
  <div id="scan-hint"></div>
  <button id="scan-cancel">✕</button>
</div>

<script src="js/vendor/three.min.js?v=0.9.9"></script>
<script src="js/rng.js?v=0.9.9"></script>
<script src="js/const.js?v=0.9.9"></script>
<script src="js/worldgen.js?v=0.9.9"></script>
<script src="js/nav.js?v=0.9.9"></script>
<script src="js/world.js?v=0.9.9"></script>
<script src="js/ai.js?v=0.9.9"></script>
<script src="js/terrain.js?v=0.9.9"></script>
<script src="js/render3d.js?v=0.9.9"></script>
<script src="js/render_select.js?v=0.9.9"></script>
<script src="js/qrcode.js?v=0.9.9"></script>
<script src="js/net.js?v=0.9.9"></script>
<script src="js/record.js?v=0.9.9"></script>
<script src="js/ui.js?v=0.9.9"></script>
<script src="js/game.js?v=0.9.9"></script>
</body>
</html>
