<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d0b18">
<title>Amber — the reach prototype</title>
<!-- A PROTOTYPE, AND NOT THE GAME. It is here to answer one question in motion: what does it
     FEEL like when a company belongs to a city and may only be ordered as far as that city
     reaches? One continuous land, six cities, overlapping reach discs, and nothing else — no
     buildings, no fog, no economy, drawn in flat 2D on purpose so that what you are looking at
     is the RULE and not the art.
     It shares the game's seeded RNG and its world generator and touches nothing else. -->
<style>
  html, body { margin: 0; height: 100%; background: #0d0b18; overflow: hidden;
               font: 13px/1.35 system-ui, -apple-system, sans-serif; color: #e8e2d4;
               -webkit-user-select: none; user-select: none; touch-action: none; }
  canvas { display: block; position: fixed; inset: 0; }
  #hud { position: fixed; left: 0; right: 0; top: 0; padding: calc(env(safe-area-inset-top,0) + 8px) 10px 8px;
         display: flex; gap: 8px; align-items: flex-start; pointer-events: none; }
  #tally { background: rgba(10,8,18,.62); border: 1px solid #ffffff22; border-radius: 5px;
           padding: 5px 9px; letter-spacing: .3px; }
  #tally b { color: #ffd98a; }
  #say { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom,0) + 70px);
         background: rgba(10,8,18,.75); border: 1px solid #ffffff22; border-radius: 5px;
         padding: 6px 12px; opacity: 0; transition: opacity .25s; max-width: 88vw; text-align: center; }
  #say.on { opacity: 1; }
  #bar { position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 6px; justify-content: center;
         padding: 8px 10px calc(env(safe-area-inset-bottom,0) + 10px); }
  button { background: #221d33; color: #e8e2d4; border: 1px solid #ffffff2a; border-radius: 5px;
           padding: 8px 12px; font: inherit; letter-spacing: .5px; }
  button.on { border-color: #ffd98a; color: #ffd98a; }
  #legend { position: fixed; right: 10px; bottom: calc(env(safe-area-inset-bottom,0) + 62px);
            background: rgba(10,8,18,.6); border: 1px solid #ffffff1a; border-radius: 5px;
            padding: 5px 8px; font-size: 11px; line-height: 1.5; opacity: .85; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><div id="tally"></div></div>
<div id="say"></div>
<div id="legend"></div>
<div id="bar">
  <button id="pick">PICK A COMPANY</button>
  <button id="reach" class="on">REACH</button>
  <button id="again">NEW LAND</button>
</div>
<script src="../../js/rng.js"></script>
<script src="../../js/const.js"></script>
<script src="../../js/worldgen.js"></script>
<script src="proto.js"></script>
</body>
</html>
